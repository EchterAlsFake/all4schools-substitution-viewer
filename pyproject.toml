[project]
name = "vplan"
version = "1.0.0"
description = "Independent mobile-first substitution plan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.15.0",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.40",
    "starlette>=0.47.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
